name: Publish Android Maven candidate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact reviewed SDK source commit; empty uses this workflow commit
        required: false
        type: string
        default: ''
      apply:
        description: Publish only the exact source and manifest approved in scripts/release-approval.json
        required: true
        type: boolean
        default: false
      check_access:
        description: Check publisher credential scope using read-only requests; do not build or publish
        required: true
        type: boolean
        default: false

permissions:
  contents: read

# Every publishing run shares one queue. Never interrupt an in-flight upload.
concurrency:
  group: android-maven-r2
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      source_sha: ${{ steps.scope.outputs.source_sha }}
    steps:
      - name: Validate manual dispatch scope
        id: scope
        env:
          SOURCE_INPUT: ${{ inputs.source_sha }}
          APPLY: ${{ inputs.apply }}
          CHECK_ACCESS: ${{ inputs.check_access }}
        run: |
          python3 - <<'PY'
          import os, re
          def require(condition, message):
              if not condition:
                  raise SystemExit(message)
          require(os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch', 'Manual dispatch only')
          require(os.environ['GITHUB_REPOSITORY'] == 'Luximio/luximio-android-sdk', 'Wrong SDK repository')
          require(os.environ['GITHUB_REF'] == 'refs/heads/main', 'Run only from main')
          require(not (os.environ['APPLY'] == 'true' and os.environ['CHECK_ACCESS'] == 'true'), 'Choose publish or access check')
          source = os.environ['SOURCE_INPUT'] or os.environ['GITHUB_SHA']
          require(re.fullmatch('[0-9a-f]{40}', source), 'Use a full lowercase source commit SHA')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('source_sha=' + source + '\n')
          PY

  build:
    needs: guard
    if: ${{ !inputs.check_access }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      artifact_id: ${{ steps.stage-artifact.outputs.artifact-id }}
    steps:
      - name: Check out trusted publishing tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: tooling
          fetch-depth: 0
          persist-credentials: false
      - name: Verify selected source belongs to this trusted workflow history
        env:
          SOURCE_SHA: ${{ needs.guard.outputs.source_sha }}
        run: git -C tooling merge-base --is-ancestor "$SOURCE_SHA" HEAD
      - name: Check out exact SDK source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.source_sha }}
          path: sdk-source
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-disabled: true
          dependency-graph: disabled
          build-scan-publish: false
          validate-wrappers: true
      - name: Install Android SDK components
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager_path="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$sdkmanager_path" ]]; then
            printf 'Android SDK manager is not executable at %s\n' "$sdkmanager_path" >&2
            exit 1
          fi
          "$sdkmanager_path" --install 'platforms;android-37.0' 'build-tools;37.0.0'
      - name: Test, lint and create local Maven candidate
        working-directory: sdk-source
        run: ./gradlew --no-daemon testDebugUnitTest lintRelease publishReleasePublicationToLocalCandidateRepository
      - name: Stage only validated public Maven files
        run: python3 tooling/scripts/stage_maven.py prepare --sdk-root sdk-source --source sdk-source/build/local-maven --output stage
      - name: Show offline publication plan
        env:
          SOURCE_SHA: ${{ needs.guard.outputs.source_sha }}
        run: python3 tooling/scripts/publish_maven.py stage --sdk-root sdk-source --source-sha "$SOURCE_SHA"
      - name: Preserve validated stage privately
        id: stage-artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validated-maven-stage
          path: stage/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
          overwrite: false

  publish:
    name: Verify and optionally publish
    needs: [guard, build]
    if: ${{ !inputs.check_access }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out trusted publishing tools and approval
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: tooling
          persist-credentials: false
      - name: Check out exact SDK source for content validation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.guard.outputs.source_sha }}
          path: sdk-source
          persist-credentials: false
      - name: Download this run's immutable stage artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact_id }}
          path: stage
          digest-mismatch: error
      - name: Revalidate downloaded content before credential access
        run: python3 tooling/scripts/stage_maven.py verify --sdk-root sdk-source --stage stage
      - name: Show transferred candidate publication plan
        env:
          SOURCE_SHA: ${{ needs.guard.outputs.source_sha }}
        run: python3 tooling/scripts/publish_maven.py stage --sdk-root sdk-source --source-sha "$SOURCE_SHA"
      - name: Require the reviewed source and manifest approval
        if: ${{ inputs.apply }}
        env:
          SOURCE_SHA: ${{ needs.guard.outputs.source_sha }}
        run: python3 tooling/scripts/publish_maven.py stage --sdk-root sdk-source --source-sha "$SOURCE_SHA" --approval tooling/scripts/release-approval.json --check-approval
      - name: Publish without overwriting any object
        if: ${{ inputs.apply }}
        env:
          SOURCE_SHA: ${{ needs.guard.outputs.source_sha }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python3 tooling/scripts/publish_maven.py stage --sdk-root sdk-source --source-sha "$SOURCE_SHA" --approval tooling/scripts/release-approval.json --apply

  check-access:
    needs: guard
    if: ${{ inputs.check_access && !inputs.apply }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out trusted credential-check tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify read-only publisher credential scope
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: python3 scripts/publish_maven.py --check-access
